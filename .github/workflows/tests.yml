name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: course_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: course_platform
      DB_USER: postgres
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      BASE_URL: http://api:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d --wait db api

      - name: Run tests
        run: docker compose run --rm tests

      # The tests container creates these folders as root, so scripts
      # running on the runner could not write to them.
      - name: Fix ownership of test results
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" test-results logs

      - name: Write test summary
        if: always()
        run: python3 scripts/junit_summary.py test-results/junit.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Collect test failures
        if: always()
        run: python3 scripts/collect_test_failures.py test-results/junit.xml test-results/failures.json

      # The system Python of the runner does not allow pip install.
      - name: Set up Python
        if: failure()
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Analyze test failures with AI
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install -r scripts/requirements.txt
          python scripts/failure_analyzer.py test-results/failures.json test-results/failure_analysis.md
          if [ -f test-results/failure_analysis.md ]; then
            cat test-results/failure_analysis.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: |
            test-results/failures.json
            test-results/failure_analysis.md
          if-no-files-found: warn
          retention-days: 14